name: Bug report
description: Something the processor or runtime does wrong — generation failure, wrong SQL, wrong output, build breakage.
labels: ["bug"]
body:
  - type: input
    id: family-version
    attributes:
      label: entity-metamodel version
      placeholder: "2.0.0"
    validations:
      required: true
  - type: input
    id: jdk
    attributes:
      label: JDK version
      placeholder: "temurin 21.0.4"
    validations:
      required: true
  - type: input
    id: spring-versions
    attributes:
      label: Spring Data Relational / R2DBC versions
      placeholder: "spring-data-relational 4.1.1, spring-data-r2dbc 4.1.1"
    validations:
      required: false
  - type: textarea
    id: entity-sample
    attributes:
      label: Minimal entity sample
      description: The smallest entity class (or classes) — plus the query description, if the bug is in the query runtime — that reproduces the problem.
      render: java
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs actual
      description: What you expected it to generate, render or return, and what happened instead. Include the relevant build log lines or the rendered SQL from RenderedStatement.preview().
    validations:
      required: true
