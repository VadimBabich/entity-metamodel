# Version updates for the reactor's POMs and the pinned workflow actions.
# Modest PR limits: solo-maintained repository.
version: 2
updates:
  - package-ecosystem: "maven"
    directories:
      - "/"
      - "/entity-metamodel-core"
      - "/entity-metamodel-runtime"
      - "/entity-metamodel-runtime-r2dbc"
      - "/entity-metamodel-processor"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
