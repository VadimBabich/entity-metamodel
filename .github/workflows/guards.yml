name: Guards

# Separate from maven.yml so a guard failure is unambiguous and these run once, not per JDK.

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# Same key as maven.yml — see its comment. Safe for a guard: whichever run survives examines the
# same commits, and a cancelled required check blocks rather than passes. Master is never
# cancelled, so a guard always completes on the release line.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# GitHub's implicit shell is `bash -e`, with no pipefail. Every guard here reads git through
# pipelines, so that default would let a failing stage pass as success.
defaults:
  run:
    shell: bash

jobs:
  # Kept in its own job so a gitleaks failure is isolated in the checks list.
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # gitleaks scans commit history, not just the worktree
      # Upstream image, pinned by digest: a mutable tag could change what executes here with
      # the repository bind-mounted. Bump tag and digest together.
      - name: Run gitleaks over full history
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --redact --verbose

  # Two checks, one runner: both are seconds of work behind a checkout, and runner startup
  # dominated when they had a job each.
  policy:
    name: No unlisted addresses, no private material
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # authorship and diffs need history, not just the worktree
      # New commits only: auditing all history would fail on pre-guard commits and tempt a rewrite
      # that unpublishes nothing. gitleaks above cannot replace this — it scans patch content only,
      # so commit messages and author/committer identity are invisible to it.
      - name: Fail on email addresses not in the allowlist
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          scan_range="$(./.github/scripts/resolve-scan-range.sh)"

          echo "scanning ${scan_range}"

          ./.github/scripts/check-emails.sh range "${scan_range}"

      # The risk is licensed third-party source, not only credentials. .gitignore is the
      # primary guard; this is the backstop if an ignore is ever weakened.
      - name: Fail if private material is tracked
        run: |
          tracked_files="$(git ls-files)"

          if tracked_private_paths="$(printf '%s\n' "${tracked_files}" | grep -E '^(_doc/|docs/(repo_usage|repository)/)')"; then
            echo "::error::Private material is tracked in git:"
            echo "${tracked_private_paths}"
            exit 1
          fi

          echo "clean — no private paths tracked"
