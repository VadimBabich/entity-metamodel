name: Guards

# Separate from maven.yml so a guard failure is unambiguous and these run once, not per JDK.

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# GitHub's implicit shell is `bash -e`, with no pipefail. Every guard here reads git through
# pipelines, so that default would let a failing stage pass as success.
defaults:
  run:
    shell: bash

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # gitleaks scans commit history, not just the worktree
      # Upstream image, pinned by digest: a mutable tag could change what executes here with
      # the repository bind-mounted. Bump tag and digest together.
      - name: Run gitleaks over full history
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --redact --verbose

  emails:
    name: No unlisted email addresses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # authorship and diffs need history, not just the worktree
      # New commits only. Auditing all history would fail on pre-guard commits and tempt a
      # rewrite that unpublishes nothing. Allowlist: .github/allowed-emails.txt.
      - name: Fail on email addresses not in the allowlist
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          scan_range="$(./.github/scripts/resolve-scan-range.sh)"

          echo "scanning ${scan_range}"

          ./.github/scripts/check-emails.sh range "${scan_range}"

  private-paths:
    name: No private material tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The risk is licensed third-party source, not only credentials. .gitignore is the
      # primary guard; this is the backstop if an ignore is ever weakened.
      - name: Fail if private material is tracked
        run: |
          tracked_files="$(git ls-files)"

          if tracked_private_paths="$(printf '%s\n' "${tracked_files}" | grep -E '^(_doc/|docs/(repo_usage|repository)/)')"; then
            echo "::error::Private material is tracked in git:"
            echo "${tracked_private_paths}"
            exit 1
          fi

          echo "clean — no private paths tracked"

  release-wiring:
    name: Release-wiring guard still works
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The guard itself runs only on a release dispatch, which may be months away, so nothing
      # would notice a refactor that disarmed it until the one run where it is load-bearing.
      # They exercise it against synthetic reactors rather than this one, because a healthy
      # reactor cannot produce the failures the guard exists to catch.
      - name: Run the release-wiring controls
        run: ./.github/scripts/verify-release-wiring-controls.sh
