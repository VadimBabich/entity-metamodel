name: Maven CI/CD

on:
  push:
    branches:
      - master
      - 'feature/**'
      - 'bug/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# Feature-branch pushes stay a trigger on purpose: this project merges its own branches without
# opening a pull request, so the push run is the only CI those commits ever get. The group key pays
# for the duplicate triggers that buys: a branch push and the pull request from that same branch
# share one group, so the superseded run is cancelled.
#
# The repository component isolates fork pull requests: head.ref is a bare branch name, so a fork
# branch called master would otherwise share this repository's master group. head.label carries the
# owner but reads "owner:branch" for same-repo pull requests too, which would split every dependabot
# pull request from its own branch push and lose that deduplication.
#
# Cancellation is off on master: two commits landing close together must not leave the release line
# with no completed build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21', '25' ]
    name: Build and test (JDK ${{ matrix.java }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 7
          if-no-files-found: ignore

  # Proves the reproducible-build mechanism off the maintainer's machine: two clean test-skipped
  # builds must produce byte-identical jars. JDK 21 is the release JDK; cross-JDK and cross-OS
  # comparison is a designed follow-up, deliberately not gated here.
  reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Reproducible build check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build twice and compare jar digests
        run: |
          ./mvnw -B clean package -DskipTests
          find . -path '*/target/*.jar' -not -path '*/it/*' -print0 | sort -z \
            | xargs -0 sha256sum > "$RUNNER_TEMP/first-build.sha256"
          # An empty digest file compares equal to an empty digest file: without this the gate
          # reports green when the jar glob stops matching (module move, target override).
          test -s "$RUNNER_TEMP/first-build.sha256"
          ./mvnw -B clean package -DskipTests
          find . -path '*/target/*.jar' -not -path '*/it/*' -print0 | sort -z \
            | xargs -0 sha256sum > "$RUNNER_TEMP/second-build.sha256"
          diff "$RUNNER_TEMP/first-build.sha256" "$RUNNER_TEMP/second-build.sha256"

  # The gate is POM-bound, so every matrix cell above already enforces it; this job exists to be
  # the named check for branch protection and an API-break signal that does not wait for
  # PostgreSQL. Both skip flags are load-bearing: failsafe keeps running under -DskipTests alone,
  # so without -DskipITs this job starts the container suite it exists to avoid.
  api-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Revapi check (JDK 21)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run the API compatibility gate
        run: ./mvnw -B -DskipTests -DskipITs verify
