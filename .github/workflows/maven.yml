name: Maven CI/CD

on:
  push:
    branches:
      - master
      - 'feature/**'
      - 'bug/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21', '25' ]
    name: Build and test (JDK ${{ matrix.java }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test
        run: mvn -B verify

  # Proves the reproducible-build mechanism off the maintainer's machine: two clean
  # test-skipped builds must produce byte-identical jars (project.build.outputTimestamp
  # pins the timestamps). JDK 21 = the release JDK. Cross-JDK/cross-OS comparison is a
  # designed follow-up, deliberately not gated here.
  reproducibility:
    runs-on: ubuntu-latest
    name: Reproducible build check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build twice and compare jar digests
        run: |
          mvn -B clean package -DskipTests
          find . -path '*/target/*.jar' -not -path '*/it/*' -print0 | sort -z \
            | xargs -0 sha256sum > "$RUNNER_TEMP/first-build.sha256"
          # An empty digest file compares equal to an empty digest file: without this the
          # gate reports green when the jar glob stops matching (module move, target override).
          test -s "$RUNNER_TEMP/first-build.sha256"
          mvn -B clean package -DskipTests
          find . -path '*/target/*.jar' -not -path '*/it/*' -print0 | sort -z \
            | xargs -0 sha256sum > "$RUNNER_TEMP/second-build.sha256"
          diff "$RUNNER_TEMP/first-build.sha256" "$RUNNER_TEMP/second-build.sha256"
